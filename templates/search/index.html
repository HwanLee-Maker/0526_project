{% extends "base.html" %}

{% block title %}주소록 검색 - 주소록 관리{% endblock %}

{% block content %}
  <section class="page-heading">
    <div>
      <p class="eyebrow">Contacts</p>
      <h1>주소록</h1>
    </div>
    <button id="logoutButton" type="button" class="secondary-button">로그아웃</button>
  </section>

  <section class="toolbar">
    <form id="searchForm" class="search-form">
      <input id="searchInput" name="q" type="search" placeholder="이름, 성별, 주소, MBTI 검색">
      <button type="submit" class="secondary-button">검색</button>
    </form>
  </section>

  <section class="editor">
    <div class="compact-heading">
      <h2>연락처 추가</h2>
      <span id="contactMessage" class="message" aria-live="polite"></span>
    </div>
    <form id="contactForm" class="contact-form">
      <label>
        이름
        <input id="name" name="name" type="text" placeholder="홍길동" maxlength="40" required>
      </label>
      <label>
        성별
        <select id="gender" name="gender" required>
          <option value="">선택</option>
          <option value="남">남</option>
          <option value="여">여</option>
        </select>
      </label>
      <label>
        나이
        <input id="age" name="age" type="number" min="1" max="120" placeholder="25" required>
      </label>
      <label>
        주소
        <input id="address" name="address" type="text" placeholder="서울 강남구" maxlength="120" required>
      </label>
      <label>
        MBTI
        <select id="mbti" name="mbti" required>
          <option value="">선택</option>
          <option value="INTJ">INTJ</option>
          <option value="INTP">INTP</option>
          <option value="ENTJ">ENTJ</option>
          <option value="ENTP">ENTP</option>
          <option value="INFJ">INFJ</option>
          <option value="INFP">INFP</option>
          <option value="ENFJ">ENFJ</option>
          <option value="ENFP">ENFP</option>
          <option value="ISTJ">ISTJ</option>
          <option value="ISFJ">ISFJ</option>
          <option value="ESTJ">ESTJ</option>
          <option value="ESFJ">ESFJ</option>
          <option value="ISTP">ISTP</option>
          <option value="ISFP">ISFP</option>
          <option value="ESTP">ESTP</option>
          <option value="ESFP">ESFP</option>
        </select>
      </label>
      <button type="submit" class="primary-button">추가</button>
    </form>
  </section>

  <section class="contact-table" aria-label="주소록 목록">
    <div class="table-summary">
      <strong>검색 결과</strong>
      <span id="resultCount">0건</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>이름</th>
          <th>성별</th>
          <th>나이</th>
          <th>주소</th>
          <th>MBTI</th>
        </tr>
      </thead>
      <tbody id="contactTableBody">
        <tr>
          <td colspan="5" class="empty-cell">주소록을 불러오는 중입니다.</td>
        </tr>
      </tbody>
    </table>
  </section>
{% endblock %}

{% block scripts %}
  <script src="/search/search.js"></script>
{% endblock %}
